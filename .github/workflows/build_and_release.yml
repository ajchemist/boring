name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        # Keep Unix socket paths short, particularly on macOS.
        env:
          TMPDIR: /tmp
        run: |
          make build-test
          go test ./...
          go vet ./...

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "Select a version tag to release"; exit 1; }
          make build-grid TAG="$TAG"
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/boring-"$TAG"-*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "boring $TAG" --generate-notes "${flags[@]}"
