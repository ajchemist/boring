name: Daily upstream drift briefing

on:
  schedule:
    # 09:17 Asia/Seoul. GitHub schedules can run later under load.
    - cron: '17 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/daily_upstream_briefing.yml'
      - '.github/scripts/drift_*'

permissions:
  contents: read

concurrency:
  group: daily-upstream-briefing-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun add --global @earendil-works/pi-coding-agent@0.87.1
      - run: python3 -m unittest discover -s .github/scripts -p 'drift_test.py' -v
      - run: bun test ./.github/scripts/drift_pi_guard.test.mjs

  briefing:
    if: github.repository == 'ajchemist/boring' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Measure upstream and fork drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/drift_briefing.py collect --output "$RUNNER_TEMP/drift"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install Pi coding agent
        run: bun add --global @earendil-works/pi-coding-agent@0.87.1

      - name: Inspect drift with Pi coding agent through OmniRoute
        env:
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL }}
        run: python3 .github/scripts/drift_pi.py "$RUNNER_TEMP/drift"

      - name: Publish today's issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/drift_briefing.py publish --output "$RUNNER_TEMP/drift"
